<form method="POST" 
      action="{{ url_for('home.handle_card_click') }}" 
      class="custom-card {{ 'standalone' if card.is_standalone else 'category' }} 
             {{ 'selected' if card.selected else '' }}">
    
    <input type="hidden" name="card_id" value="{{ card.id }}">
    <input type="hidden" name="is_standalone" value="{{ 1 if card.is_standalone else 0 }}">
    <input type="hidden" name="text" value="{{ card.text }}">
    <input type="hidden" name="icon" value="{{ card.image_source }}">

    <!-- Corner checkmark (hidden if not selected) -->
    <div class="checkmark">
        {% if card.selected %}
            ✓
        {% endif %}
    </div>

    <!-- Card Image -->
    <div class="card-image">
        <img src="{{ card.image_source }}" alt="{{ card.text }}">
    </div>

    <!-- Card Text -->
    <div class="card-text">{{ card.text }}</div>

    <!-- Overlay button -->
    <button type="submit" class="card-overlay"></button>
</form>
