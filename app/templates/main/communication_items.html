{% extends "layouts/base_logged_in.html" %}
{% block title %}Communication Items{% endblock %}
{% block content %}
<h2>Your Items</h2>
<form method="post">
    <input type="text" name="content" placeholder="New item">
    <button type="submit">Add</button>
</form>
<ul>
    {% for item in current_user.communication_items %}
        <li>{{ item.content }}</li>
    {% endfor %}
</ul>
{% endblock %}
