<!doctype html>
<html>
<head>
    <title>{% block title %}{% endblock %}</title>
    {% block extra_css %}
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base_logged_in.css')}}">
    {% endblock %}
</head>
<body>
    <!-- Phrase Toolbar -->
    {% if phrase_toolbar %}
        <div id="phrase-toolbar">
            {{ phrase_toolbar.render()|safe }}
        </div>
    {% endif %}

    <!-- Main Toolbar -->
    {% if main_toolbar %}
        <div id="main-toolbar">
            {{ main_toolbar.render()|safe }}
        </div>
    {% endif %}
    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
