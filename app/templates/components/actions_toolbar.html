{# templates/components/actions_toolbar.html #}
<div id="actions-toolbar" class="actions-toolbar">
    <!-- Menu toggle -->
    <button type="button" class="action-btn" id="menu-btn" onclick="toggleActionsToolbar()">
        <i class="fa fa-th"></i>
    </button>

    <div class="spacer"></div>

    <!-- Select All button -->
    <form method="POST" action="{{ url_for('actions_toolbar.select_all') }}" style="display:none">
        <button type="submit" id="select-all-btn" class="action-btn" disabled>
            <i class="fa fa-square-o"></i>
        </button>
    </form>

    <!-- Delete Selected button -->
    <form method="POST" action="{{ url_for('actions_toolbar.delete_selected') }}" style="display:none">
        <button type="submit" id="delete-btn" class="action-btn" disabled>
            <i class="fa fa-trash"></i>
        </button>
    </form>

    <!-- Edit Selected button -->
    <form method="POST" action="{{ url_for('actions_toolbar.edit_selected') }}" style="display:none">
         <button type="submit" id="edit-btn" class="action-btn" disabled>
            <i class="fa fa-pencil"></i>
        </button>
    </form>

    <!-- Add new category -->
    <button type="button" id="add-btn" class="action-btn" onclick="openCategoryPopup()">
        <i class="fa fa-plus"></i>
    </button>
</div>

{# Include the modern delete confirmation popup #}
{% include 'components/popup_form.html' %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/popup.css') }}">
